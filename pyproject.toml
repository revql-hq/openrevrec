[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openrevrec"
version = "0.1.0"
description = "A local, deterministic revenue accounting workbench"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "openpyxl>=3.1,<4", "waitress>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.16,<7"]

[project.scripts]
openrevrec = "openrevrec.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openrevrec = ["**/*.sql", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
